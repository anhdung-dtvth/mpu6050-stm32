<text x="654" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e7781" text-anchor="end">24</text>
<text x="30" y="856" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e7781" text-anchor="start">sync = AA 55 · cfg = dải đo accel/gyro · seq = đếm frame (phát hiện mất) · CRC trên byte 2..21</text>
<text x="720" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start">Ghi chú</text>
<text x="720" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#444c56" text-anchor="start">• Quaternion: sensor → earth, trục Z hướng lên; nằm phẳng = đơn vị</text>
<text x="720" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#444c56" text-anchor="start">• MPU6050 không có la bàn → yaw sẽ trôi, dùng nút Reset yaw</text>
<text x="720" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#444c56" text-anchor="start">• Mất frame: seq nhảy · sai CRC: bỏ frame và tự đồng bộ lại</text>
<text x="720" y="856" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#444c56" text-anchor="start">• Nét liền: dữ liệu · nét đứt: điều khiển / nối công cụ</text>
