<text x="628.0" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">CRC</text>
<text x="32" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e7781" text-anchor="start">0</text>
<text x="84" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e7781" text-anchor="start">2</text>
<text x="110" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e7781" text-anchor="start">3</text>
<text x="136" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e7781" text-anchor="start">4</text>
<text x="240" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6e7781" text-anchor="start">8</text>
